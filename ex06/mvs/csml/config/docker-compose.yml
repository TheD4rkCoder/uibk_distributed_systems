x-cirrina: &cirrina
  image: collaborativestatemachines/cirrina:latest
  platform: linux/amd64
  depends_on: [etcd, zenoh]
  volumes:
    - ../src/uc4.pkl:/app/main.pkl:ro
    - ./zenoh.json5:/app/zenoh.json5:ro
  environment: &env
    ETCD_CONTEXT_URL: http://etcd:2379
    ZENOH_EVENT_HANDLER_CONFIG_URI: /app/zenoh.json5

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.7
    command:
      - /usr/local/bin/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
  zenoh:
    image: eclipse/zenoh:latest

  coordinator:
    <<: *cirrina
    environment: { <<: *env, RUN: coordinator }
  sensor1:
    <<: *cirrina
    depends_on: [coordinator]
    environment: { <<: *env, RUN: sensor1 }
  sensor2:
    <<: *cirrina
    depends_on: [coordinator]
    environment: { <<: *env, RUN: sensor2 }
  sensor3:
    <<: *cirrina
    depends_on: [coordinator]
    environment: { <<: *env, RUN: sensor3 }
