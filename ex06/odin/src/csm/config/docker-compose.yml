# UC2: etcd (persistent data) + Zenoh router (events) + one Cirrina container per instance.
# All Cirrina containers load the same uc2.pkl; RUN selects the instance(s) to execute.
services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.0
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    networks: [uc2]
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 15

  zenoh:
    image: eclipse/zenoh:latest
    networks: [uc2]

  manager:
    image: collaborativestatemachines/cirrina:2.4.1
    depends_on:
      etcd:
        condition: service_healthy
      zenoh:
        condition: service_started
    environment:
      RUN: resourceManager
      MAIN_URI: file:///app/uc2.pkl
      ETCD_CONTEXT_URL: http://etcd:2379
      ZENOH_EVENT_HANDLER_CONFIG_URI: /zenoh.json5
    volumes:
      - ../src:/app:ro,z
      - ./zenoh.json5:/zenoh.json5:ro,z
    networks: [uc2]

  client1:
    image: collaborativestatemachines/cirrina:2.4.1
    depends_on:
      etcd:
        condition: service_healthy
      zenoh:
        condition: service_started
      manager:
        condition: service_started
    environment:
      RUN: client1
      MAIN_URI: file:///app/uc2.pkl
      ETCD_CONTEXT_URL: http://etcd:2379
      ZENOH_EVENT_HANDLER_CONFIG_URI: /zenoh.json5
    volumes:
      - ../src:/app:ro,z
      - ./zenoh.json5:/zenoh.json5:ro,z
    networks: [uc2]

  client2:
    image: collaborativestatemachines/cirrina:2.4.1
    depends_on:
      etcd:
        condition: service_healthy
      zenoh:
        condition: service_started
      manager:
        condition: service_started
    environment:
      RUN: client2
      MAIN_URI: file:///app/uc2.pkl
      ETCD_CONTEXT_URL: http://etcd:2379
      ZENOH_EVENT_HANDLER_CONFIG_URI: /zenoh.json5
    volumes:
      - ../src:/app:ro,z
      - ./zenoh.json5:/zenoh.json5:ro,z
    networks: [uc2]

  client3:
    image: collaborativestatemachines/cirrina:2.4.1
    depends_on:
      etcd:
        condition: service_healthy
      zenoh:
        condition: service_started
      manager:
        condition: service_started
    environment:
      RUN: client3
      MAIN_URI: file:///app/uc2.pkl
      ETCD_CONTEXT_URL: http://etcd:2379
      ZENOH_EVENT_HANDLER_CONFIG_URI: /zenoh.json5
    volumes:
      - ../src:/app:ro,z
      - ./zenoh.json5:/zenoh.json5:ro,z
    networks: [uc2]

networks:
  uc2:
    driver: bridge
